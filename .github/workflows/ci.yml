name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The test suite has Windows-only cases (test/exec.test.ts), so run both.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No dependencies to install: package.json has none.
      - run: npm test
        env:
          # The default Windows TEMP is an 8.3 short path (RUNNER~1), which git
          # expands, so path comparisons in the worktree tests don't match.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
